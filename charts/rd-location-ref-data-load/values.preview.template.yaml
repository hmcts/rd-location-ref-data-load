job:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  secrets:
    BLOB_ACCOUNT_NAME:
      secretRef: storage-account-{{ .Release.Name }}-blobstorage
      key: storage_account_name
    BLOB_ACCESS_KEY:
      secretRef: storage-secret-{{ .Release.Name }}-blobstorage
      key: accessKey
    ACCOUNT_NAME:
      secretRef: storage-account-{{ .Release.Name }}-blobstorage
      key: storage_account_name
    ACCOUNT_KEY:
      secretRef: storage-secret-{{ .Release.Name }}-blobstorage
      key: accessKey
    BLOB_SERVICE_ENDPOINT:
      secretRef: storage-secret-{{ .Release.Name }}-blobstorage
      key: blobEndpoint
  global:
    jobKind: CronJob
  environment:
    POSTGRES_HOST: "{{ .Release.Name }}-postgresql"
    POSTGRES_DB_NAME: "{{ .Values.postgresql.auth.database}}"
    POSTGRES_USERNAME: "{{ .Values.postgresql.auth.username}}"
    POSTGRES_PASSWORD: "{{ .Values.postgresql.auth.password}}"
    POSTGRES_PORT: "{{ .Values.postgresql.auth.port}}"
    LOCATIONS_DB: classpath:db/migration,classpath:db/postgres,classpath:db/migrationAks
    FLYWAY_ENABLED: true
    CONTAINER_NAME: lrd-ref-data-preview-data-test
  keyVaults:
    "rd":
      resourceGroup: rd
      secrets:
        - name: app-insights-connection-string
          alias: app-insights-connection-string
  postgresql:
    enabled: true
    auth:
      username: dbrdlocationref
      password: dbrdlocationref
      database: dbrdlocationref
      port: 5432

blobstorage:
  resourceGroup: rd-aso-preview-rg
  teamName: "RD"
  location: uksouth
  setup:
    containers:
      - lrd-ref-data
      - lrd-ref-data-archive
      - lrd-ref-data-preview-data-test
      - lrd-ref-data-preview-data-test-archive
  enabled: true