job:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  global:
    jobKind: CronJob
  environment:
    POSTGRES_DB_NAME: dbrdlocationref
    POSTGRES_HOST: rd-location-ref-api-pr-1239-postgresql
    POSTGRES_PASSWORD: dbrdlocationref
    POSTGRES_NAME: dbrdlocationref
    POSTGRES_USERNAME: dbrdlocationref
    POSTGRES_PORT: 5432
    FLYWAY_ENABLED: false
    CONTAINER_NAME: lrd-ref-data
  keyVaults:
    "rd":
      resourceGroup: rd
      secrets:
        - name: app-insights-connection-string
          alias: app-insights-connection-string
        - name: rd-location-storage-account-name-preview
          alias: ACCOUNT_NAME
        - name: rd-location-storage-account-primary-key-preview
          alias: ACCOUNT_KEY
postgresql:
  enabled: true
  image:
    tag: '11.16.0'
  auth:
    username: dbrdlocationref
    database: dbrdlocationref
  ## Disable Postgres Persistence
  primary:
    persistence:
      enabled: false

blobstorage:
  resourceGroup: rd-aso-preview-rg
  teamName: "RD"
  location: uksouth
  setup:
    containers:
      - lrd-ref-data
      - lrd-ref-data-archive
      - lrd-ref-data-new-test
  enabled: true